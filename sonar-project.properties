sonar.projectKey=conorheffron_shopping-cart-go
sonar.organization=conorheffron

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=shopping-cart-go
#sonar.projectVersion=1.0

#sonar server and project prop
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.go.coverage.reportPaths=coverage.xml,coverage.out
